spring:
  application:
    name: oasis25-backend
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

oasis:
  cors:
    allowed-origins: https://oasis25.duckdns.org,https://ssg-frontend-eight.vercel.app,http://localhost:3000,http://localhost:5173,http://localhost:8080
  stats:
    zone-id: Asia/Seoul

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

imgbb:
  api-key: ${IMGBB_API_KEY}
